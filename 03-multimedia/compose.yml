---
services:
  # --- JELLYFIN ---
  jellyfin:
    image: jellyfin/jellyfin:2026061506
    container_name: jellyfin
    user: ${PUID}:${PGID}
    restart: unless-stopped
    ports: [8096:8096/tcp, 7359:7359/udp]
    networks: [lefrigo-net]
    environment: [JELLYFIN_PublishedServerUrl=https://stream.le-frigo.fr]
    volumes:
      - ${APPS_DATA_DIR}/jellyfin/config:/config
      - ${APPS_DATA_DIR}/jellyfin/cache:/cache
      - type: bind
        source: ${MEDIA_DATA_DIR}/films
        target: /films
      - type: bind
        source: ${MEDIA_DATA_DIR}/series
        target: /series
        read_only: true
      - type: bind
        source: ${MEDIA_DATA_DIR}/stuck_in_yesterday
        target: /stuck_in_yesterday
        read_only: true
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin-router.rule=Host(`stream.le-frigo.fr`)
      - traefik.http.routers.jellyfin-router.entrypoints=websecure
      - traefik.http.routers.jellyfin-router.tls.certresolver=myresolver
      - traefik.http.routers.jellyfin-router.service=jellyfin-svc
      - traefik.http.services.jellyfin-svc.loadbalancer.server.port=8096
      - traefik.docker.network=lefrigo-net
    deploy:
      resources:
        limits:
          cpus: '4.00'
          memory: 8G
        reservations:
          memory: 2G
    healthcheck:
      test: [CMD-SHELL, curl -f http://localhost:8096/health || exit 1]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- IMMICH ---
  immich-server:
    image: ghcr.io/immich-app/immich-server:commit-dc2c01e4737eb6524d1d4a16ee47ffac16264111
    container_name: immich_server
    user: ${PUID}:${PGID}
    ports: [2283:2283]
    volumes:
      - ${MEDIA_DATA_DIR}/photos:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=immich-db
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USERNAME}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
      - REDIS_HOSTNAME=${REDIS_HOSTNAME}
      - TZ=Europe/Paris
    healthcheck:
      disable: false
    depends_on:
      immich-db:
        condition: service_healthy
    networks: [lefrigo-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.immich.service=immich
      - traefik.http.routers.immich.rule=Host(`photos.le-frigo.fr`)
      - traefik.http.routers.immich.entrypoints=websecure
      - traefik.http.routers.immich.tls.certresolver=myresolver
      - traefik.http.services.immich.loadbalancer.server.port=2283
  immich-db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    user: ${PUID}:${PGID}
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: HDD
    volumes: ['${APPS_DATA_DIR}/immich:/var/lib/postgresql/data']
    shm_size: 128mb
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - lefrigo-net

  # --- AUDIOBOOKSHELF ---
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.35.1
    container_name: audiobookshelf
    ports: [8085:80]
    user: ${PUID}:${PGID}
    volumes:
      - ${APPS_DATA_DIR}/audiobookshelf/config:/config
      - ${APPS_DATA_DIR}/audiobookshelf/metadata:/metadata
      - ${MEDIA_DATA_DIR}/books:/data
    environment: [TZ=Europe/Paris]
    labels:
      - traefik.enable=true
      - traefik.http.routers.audiobookshelf.service=audiobookshelf
      - traefik.http.routers.audiobookshelf.rule=Host(`audiobooks.le-frigo.fr`)
      - traefik.http.routers.audiobookshelf.entrypoints=websecure
      - traefik.http.routers.audiobookshelf.tls.certresolver=myresolver
      - traefik.http.services.audiobookshelf.loadbalancer.server.port=80
    networks: [lefrigo-net]
    restart: always

  # --- GONIC ---
  gonic:
    image: sentriz/gonic:v0.22.0
    container_name: gonic
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment: [TZ=Europe/Paris, GONIC_SCAN_INTERVAL=15]
    ports: [4747:80]
    volumes:
      - ${APPS_DATA_DIR}/gonic/data:/data
      - ${MEDIA_DATA_DIR}/musique:/music:ro
      - ${APPS_DATA_DIR}/gonic/playlists:/playlists
      - ${APPS_DATA_DIR}/gonic/cache:/cache
      - ${APPS_DATA_DIR}/gonic/podcasts:/podcasts
    security_opt: [no-new-privileges:true]
    labels:
      - traefik.enable=true
      - traefik.http.routers.gonic-api.rule=Host(`music.api.le-frigo.fr`)
      - traefik.http.routers.gonic-api.entrypoints=websecure
      - traefik.http.routers.gonic-api.tls=true
      - traefik.http.routers.gonic-api.tls.certresolver=letsencrypt
      - traefik.http.routers.gonic-api.service=gonic-svc

      # Activation du middleware CORS
      - traefik.http.routers.gonic-api.middlewares=gonic-cors
      - traefik.http.services.gonic-svc.loadbalancer.server.port=80

      # 🛡️ Configuration CORS béton
      - traefik.http.middlewares.gonic-cors.headers.accesscontrolallowmethods=GET,OPTIONS,POST
      - traefik.http.middlewares.gonic-cors.headers.accesscontrolalloworiginlist=https://music.le-frigo.fr
      - traefik.http.middlewares.gonic-cors.headers.accesscontrolallowheaders=*
    networks: [lefrigo-net]
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:80/ping]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
  # --- VIBRDROME-WEB ---
  vibrdrome-web:
    image: ddmoney420/vibrdrome-web:v1.8.1-beta.2
    container_name: vibrdrome-web
    ports: [8009:80]
    environment: [VIBRDROME_DEFAULT_SERVER=https://music.api.le-frigo.fr]
    restart: unless-stopped
    labels:
      - traefik.enable=false
      - traefik.http.routers.vibrdrome.rule=Host(`music.le-frigo.fr`)
      - traefik.http.routers.vibrdrome.entrypoints=websecure
      - traefik.http.routers.vibrdrome.tls=true
      - traefik.http.routers.vibrdrome.tls.certresolver=myresolver
      - traefik.http.routers.vibrdrome.service=vibrdrome-svc
      - traefik.http.services.vibrdrome-svc.loadbalancer.server.port=80
      - traefik.http.routers.vibrdrome.middlewares=authentik@docker
    security_opt: [no-new-privileges:true]
    depends_on: [gonic]
    networks: [lefrigo-net]
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
networks:
  lefrigo-net:
    external: true
