---
services:
  # --- DOCKER PROXY FOR MONITORING STACK ---
  monitoring-docker-proxy:
    container_name: monitoring-docker-proxy
    environment: [CONTAINERS=1, POST=0]
    image: tecnativa/docker-socket-proxy:v0.4.2
    networks: [monitoring-docker-proxy]
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  # --- UPTIME KUMA ---
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    user: ${PUID}:${PGID}
    restart: unless-stopped
    volumes: ['${APPS_DATA_DIR}/uptime_kuma:/app/data']
    ports: [9876:3001]
    networks: [lefrigo-net, monitoring-docker-proxy]
    depends_on:
      monitoring-docker-proxy:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=Host(`kuma.le-frigo.fr`)
      - traefik.http.routers.kuma.service=kuma
      - traefik.http.routers.kuma.entrypoints=websecure
      - traefik.http.routers.kuma.tls.certresolver=myresolver
      - traefik.http.routers.kuma.middlewares=authentik@docker
      - traefik.http.services.kuma.loadbalancer.server.port=3001

  # --- BACKREST ---
  backrest:
    image: garethgeorge/backrest:v1.13.0
    container_name: backrest
    user: 0:0
    ports: [9898:9898]
    environment: [BACKREST_CONFIG=/config/config.json, BACKREST_DATA=/data]
    volumes:
      - ${APPS_DATA_DIR}/backrest/config:/config
      - ${APPS_DATA_DIR}/backrest/cache:/root/.cache/restic
      - ${APPS_DATA_DIR}/backrest/data:/data
      - ${MEDIA_DATA_DIR}/musique:/musiques
      - ${MEDIA_DATA_DIR}/films:/films
      - ${MEDIA_DATA_DIR}/series:/series
      - ${MEDIA_DATA_DIR}/audiobooks:/audiobooks
      - ${MEDIA_DATA_DIR}/books:/books
      - ${MEDIA_DATA_DIR}/photos:/photos
      - ${MEDIA_DATA_DIR}/roms/roms:/roms
      - ${MEDIA_DATA_DIR}/stuck_in_yesterday:/stuck_in_yesterday
      - ${SSH_DATA_DIR}:/root/.ssh:ro
      - ${APPS_DATA_DIR}:/apps_config
    networks: [lefrigo-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.backrest.rule=Host(`backup.le-frigo.fr`)
      - traefik.http.routers.backrest.entrypoints=websecure
      - traefik.http.routers.backrest.tls.certresolver=myresolver
      - traefik.http.routers.backrest.middlewares=authentik@docker
      - traefik.http.services.backrest.loadbalancer.server.port=9898
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
        reservations:
          memory: 256M
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://localhost:9898/ || exit 1]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  # --- TAILSCALE ---
  tailscale:
    image: tailscale/tailscale:v1.98.4
    container_name: tailscale
    user: 0:0
    hostname: le-frigo-nas
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ${APPS_DATA_DIR}/tailscale/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment: ['TS_AUTHKEY=${TS_AUTHKEY}', TS_STATEFUL_CONFIG=true]
  # --- DATABASUS ---
  databasus:
    container_name: databasus
    image: databasus/databasus:v3.48.0
    ports: [4005:4005]
    volumes: ['${APPS_DATA_DIR}/databasus/data:/databasus-data']
    restart: unless-stopped
    networks: [lefrigo-net, 01-sso_authentik-net]
  # --- VAULTWARDEN ---
  vaultwarden:
    image: vaultwarden/server:1.36.0
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.le-frigo.fr
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
    volumes: ['${APPS_DATA_DIR}/vaultwarden/data:/data/']
    ports: [4007:80]
    labels:
      - traefik.enable=true
      - traefik.http.routers.vaultwarden.rule=Host(`vault.le-frigo.fr`)
      - traefik.http.routers.vaultwarden.service=vaultwarden
      - traefik.http.routers.vaultwarden.entrypoints=websecure
      - traefik.http.routers.vaultwarden.tls.certresolver=myresolver
      - traefik.http.routers.vaultwarden.middlewares=authentik@docker
      - traefik.http.services.vaultwarden.loadbalancer.server.port=80
    networks: [lefrigo-net]
  docker-proxy-nursery:
    container_name: docker-proxy-nursery
    image: tecnativa/docker-socket-proxy
    environment:
      - CONTAINERS=1
      - POST=1
      - EVENTS=1
      - REQS=/v*/containers/*
      - /v*/events?*filter=type%3Dcontainer*
    networks: [nursery-net]
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
networks:
  lefrigo-net:
    external: true
  01-sso_authentik-net:
    external: true
  monitoring-docker-proxy:
    name: monitoring-docker-proxy
  nursery-net:
    name: nursery-net
