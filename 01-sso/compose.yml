---
services:
  # --- AUTHENTIK DATABASE ---
  authentik-db:
    image: postgres:16-alpine
    container_name: authentik-db
    restart: always
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: authentik
    volumes:
      - ${APPS_DATA_DIR}/postgres_authentik/data:/var/lib/postgresql/data
    networks: [authentik-net]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER} -d authentik']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # --- AUTHENTIK OUTPOST PROXY ---
  authentik_proxy:
    image: ghcr.io/goauthentik/proxy
    ports: [9000:9000, 9443:9443]
    environment:
      - AUTHENTIK_HOST=http://authentik-server:9000
      - AUTHENTIK_INSECURE=true
      - AUTHENTIK_TOKEN=${AUTHENTIK_PROXY_TOKEN}
    networks: [authentik-net, lefrigo-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M

  # --- AUTHENTIK WORKER ---
  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.12.4
    container_name: authentik-worker
    user: ${PUID}:${PGID}
    command: worker
    restart: unless-stopped
    depends_on:
      authentik-db:
        condition: service_healthy
    environment:
      - DOCKER_HOST=tcp://docker-proxy-read:2375
      - AUTHENTIK_POSTGRESQL__HOST=authentik-db
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${POSTGRES_PASSWORD}
      - AUTHENTIK_ERROR_REPORTING__ENABLED=true
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_EMAIL__HOST=${AUTHENTIK_EMAIL__HOST}
      - AUTHENTIK_EMAIL__PORT=${AUTHENTIK_EMAIL__PORT}
      - AUTHENTIK_EMAIL__USERNAME=${AUTHENTIK_EMAIL__USERNAME}
      - AUTHENTIK_EMAIL__PASSWORD=${AUTHENTIK_EMAIL__PASSWORD}
      - AUTHENTIK_EMAIL__USE_SSL=${AUTHENTIK_EMAIL__USE_SSL}
      - AUTHENTIK_EMAIL__FROM=${AUTHENTIK_EMAIL__FROM}
      - AUTHENTIK_WORKER__CONCURRENCY=4
    volumes: ['${APPS_DATA_DIR}/authentik/certs:/certs']
    networks: [authentik-net, lefrigo-net]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          memory: 512M

   # --- AUTHENTIK SERVER ---
  authentik-server:
    image: ghcr.io/goauthentik/server:2025.12.4
    container_name: authentik-server
    user: ${PUID}:${PGID}
    command: server
    restart: unless-stopped
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-worker:
        condition: service_healthy
    environment:
      - AUTHENTIK_POSTGRESQL__HOST=authentik-db
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${POSTGRES_PASSWORD}
      - AUTHENTIK_ERROR_REPORTING__ENABLED=true
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      - AUTHENTIK_EMAIL__HOST=${AUTHENTIK_EMAIL__HOST}
      - AUTHENTIK_EMAIL__PORT=${AUTHENTIK_EMAIL__PORT}
      - AUTHENTIK_EMAIL__USERNAME=${AUTHENTIK_EMAIL__USERNAME}
      - AUTHENTIK_EMAIL__PASSWORD=${AUTHENTIK_EMAIL__PASSWORD}
      - AUTHENTIK_EMAIL__USE_SSL=${AUTHENTIK_EMAIL__USE_SSL}
      - AUTHENTIK_EMAIL__FROM=${AUTHENTIK_EMAIL__FROM}
      - AUTHENTIK_WEB__WORKERS=2
    ports: [1001:9000, 1002:9443]
    volumes:
      - ${APPS_DATA_DIR}/authentik/data:/data
      - ${APPS_DATA_DIR}/authentik/media:/media
      - ${APPS_DATA_DIR}/authentik/custom-templates:/templates
      - ${APPS_DATA_DIR}/authentik/geoip:/geoip
      - ${APPS_DATA_DIR}/authentik/custom-icons:/web/dist/assets/icons
    networks: [authentik-net, lefrigo-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.authentik.rule=Host(`auth.le-frigo.fr`)
      - traefik.http.routers.authentik.entrypoints=websecure
      - traefik.http.routers.authentik.tls.certresolver=myresolver
      - traefik.http.middlewares.authentik.forwardauth.maxResponseBodySize=1048576
      # - traefik.http.middlewares.authentik.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
      - traefik.http.middlewares.authentik.forwardauth.address=http://authentik-outpost-proxy:9000/outpost.goauthentik.io/auth/traefik
      - traefik.http.middlewares.authentik.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.authentik.forwardauth.authResponseHeaders=Remote-User,X-Authentik-Username,X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          memory: 512M
networks:
  authentik-net:
  lefrigo-net:
    external: true
