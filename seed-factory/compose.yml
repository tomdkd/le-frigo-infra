---
services:
  jellypartiefin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellypartiefin
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      - TZ=Europe/Paris
      - JELLYFIN_PublishedServerUrl=https://jellypartiefin.le-frigo.fr
    volumes:
      - jellypartiefin:/config
      - ${MEDIA_DATA_DIR}/porn/movies:/porn/movies
      - ${MEDIA_DATA_DIR}/porn/series:/porn/series
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellypartiefin.rule=Host(`jellypartiefin.le-frigo.fr`)
      - traefik.http.routers.jellypartiefin.entrypoints=websecure
      - traefik.http.routers.jellypartiefin.tls.certresolver=myresolver
      - traefik.http.services.jellypartiefin-svc.loadbalancer.server.port=8096
      - traefik.http.routers.jellypartiefin.middlewares=error-pages-middleware@docker
    networks: [lefrigo-net]
    deploy:
      resources:
        limits:
          cpus: '4.00'
          memory: 4096M
networks:
  lefrigo-net:
    external: true
volumes:
  jellypartiefin:
  qbittorrent_config:
