services:
  # --- JELLYFIN ---
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: "3008:568"
    restart: unless-stopped
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    networks:
      - lefrigo-net
    volumes:
      - ${APPS_DATA_DIR}/jellyfin/config:/config
      - ${APPS_DATA_DIR}/jellyfin/cache:/cache
      - ${MEDIA_DATA_DIR}/films:/films
      - ${MEDIA_DATA_DIR}/series:/series:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`stream.le-frigo.fr`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=myresolver"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

  # --- NAVIDROME ---
  navidrome:
    image: deluan/navidrome:0.60.3
    container_name: navidrome
    user: "3007:568"
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      - ND_BASEURL=https://musique.le-frigo.fr
      - ND_REVERSEPROXY=true
    volumes:
      - ${APPS_DATA_DIR}/navidrome/data:/data
      - ${MEDIA_DATA_DIR}/musique:/music:ro
    networks:
      - lefrigo-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.navidrome.rule=Host(`musique.le-frigo.fr`) && !PathPrefix(`/rest`)"
      - "traefik.http.routers.navidrome.entrypoints=websecure"
      - "traefik.http.routers.navidrome.tls.certresolver=myresolver"
      - "traefik.http.routers.navidrome.middlewares=authentik@docker"

  # --- KAVITA ---
  kavita:
    image: jvmilazz0/kavita:latest
    container_name: kavita
    user: "3008:568"
    restart: unless-stopped
    volumes:
      - ${MEDIA_DATA_DIR}/mangas:/mangas
      - ${MEDIA_DATA_DIR}/livres:/books
      - ${APPS_DATA_DIR}/kavita/config:/kavita/config
    networks:
      - lefrigo-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kavita.rule=Host(`manga.le-frigo.fr`)"
      - "traefik.http.routers.kavita.entrypoints=websecure"
      - "traefik.http.routers.kavita.tls.certresolver=myresolver"

  # --- IMMICH ---
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich_server
    ports:
      - '2283:2283'
    volumes:
      - ${MEDIA_DATA_DIR}/photos:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=immich-db
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USERNAME}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
      - REDIS_HOSTNAME=${REDIS_HOSTNAME}
      - TZ=Europe/Paris
    depends_on:
      immich-db:
        condition: service_healthy
      immich-machine-learning:
        condition: service_healthy
    networks:
      - lefrigo-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`photos.le-frigo.fr`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.tls.certresolver=myresolver"

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    environment:
      - DB_HOSTNAME=immich-db
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USERNAME}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
      - TZ=Europe/Paris
    restart: always
    healthcheck:
      disable: false
    networks:
      - lefrigo-net
    depends_on:
      - immich-db

  immich-db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${APPS_DATA_DIR}/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false
    restart: always
    networks:
      - lefrigo-net

volumes:
  model-cache:

networks:
  lefrigo-net:
    external: true