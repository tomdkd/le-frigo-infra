services:
  # --- JELLYFIN ---
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    networks:
      - lefrigo-net
    environment:
      - JELLYFIN_PublishedServerUrl=https://stream.le-frigo.fr
    volumes:
      - ${APPS_DATA_DIR}/jellyfin/config:/config
      - ${APPS_DATA_DIR}/jellyfin/cache:/cache
      - type: bind
        source: ${MEDIA_DATA_DIR}/films
        target: /films
      - type: bind
        source: ${MEDIA_DATA_DIR}/series
        target: /series
        read_only: true
      - type: bind
        source: ${MEDIA_DATA_DIR}/stuck_in_yesterday
        target: /stuck_in_yesterday
        read_only: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin-router.rule=Host(`stream.le-frigo.fr`)"
      - "traefik.http.routers.jellyfin-router.entrypoints=websecure"
      - "traefik.http.routers.jellyfin-router.tls.certresolver=myresolver"
      - "traefik.http.routers.jellyfin-router.service=jellyfin-svc"
      - "traefik.http.services.jellyfin-svc.loadbalancer.server.port=8096"
      - "traefik.docker.network=lefrigo-net"
    deploy:
      resources:
        limits:
          cpus: '4.00'
          memory: 8G
        reservations:
          memory: 2G 
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- NAVIDROME ---
  navidrome:
    image: deluan/navidrome:0.60.3
    container_name: navidrome
    user: "${PUID}:${PGID}"
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      - ND_BASEURL=https://musique.le-frigo.fr
      - ND_REVERSEPROXY=true
      - ND_EXTAUTH_TRUSTEDSOURCES=172.16.0.0/12,192.168.1.0/24
      - ND_EXTAUTH_USERHEADER=X-Authentik-Username
      - ND_LOGLEVEL=debug
    volumes:
      - ${APPS_DATA_DIR}/navidrome/data:/data
      - ${MEDIA_DATA_DIR}/musique:/music:ro
    networks:
      - lefrigo-net
    labels:
      - "traefik.enable=true"
      # --- ROUTEUR 1 : Interface Web (Protégée) ---
      - "traefik.http.routers.navidrome-ui.rule=Host(`musique.le-frigo.fr`) && !PathPrefix(`/rest`)"
      - "traefik.http.routers.navidrome-ui.entrypoints=websecure"
      - "traefik.http.routers.navidrome-ui.tls=true"
      - "traefik.http.routers.navidrome-ui.tls.certresolver=myresolver"
      - "traefik.http.routers.navidrome-ui.middlewares=authentik@docker"
      - "traefik.http.routers.navidrome-ui.service=navidrome-svc"

      # --- ROUTEUR 2 : API Subsonic (Ouverte) ---
      - "traefik.http.routers.navidrome-api.rule=Host(`musique.le-frigo.fr`) && PathPrefix(`/rest`)"
      - "traefik.http.routers.navidrome-api.entrypoints=websecure"
      - "traefik.http.routers.navidrome-api.tls=true"
      - "traefik.http.routers.navidrome-api.tls.certresolver=myresolver"
      - "traefik.http.routers.navidrome-api.service=navidrome-svc"
      - "traefik.http.services.navidrome-svc.loadbalancer.server.port=4533"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4533/ping || exit 1"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- KAVITA ---
  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Paris
    volumes:
      - ${MEDIA_DATA_DIR}/books:/data:ro
      - ${APPS_DATA_DIR}/kavita/config:/config
    networks:
      - lefrigo-net
    ports:
      - "5000:5000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kavita.rule=Host(`books.le-frigo.fr`)"
      - "traefik.http.routers.kavita.service=kavita"
      - "traefik.http.routers.kavita.entrypoints=websecure"
      - "traefik.http.routers.kavita.tls.certresolver=myresolver"
      - "traefik.http.services.kavita.loadbalancer.server.port=5000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- IMMICH ---
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich_server
    user: "${PUID}:${PGID}"
    ports:
      - '2283:2283'
    volumes:
      - ${MEDIA_DATA_DIR}/photos:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=immich-db
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USERNAME}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
      - REDIS_HOSTNAME=${REDIS_HOSTNAME}
      - TZ=Europe/Paris
    healthcheck:
      disable: false
    depends_on:
      immich-db:
        condition: service_healthy
      immich-machine-learning:
        condition: service_healthy
    networks:
      - lefrigo-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.service=immich"
      - "traefik.http.routers.immich.rule=Host(`photos.le-frigo.fr`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.tls.certresolver=myresolver"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    environment:
      - DB_HOSTNAME=immich-db
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USERNAME}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
      - TZ=Europe/Paris
    restart: always
    healthcheck:
      disable: false
    networks:
      - lefrigo-net
    depends_on:
      - immich-db

  immich-db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    user: "${PUID}:${PGID}"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${APPS_DATA_DIR}/immich:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - lefrigo-net

  # --- AUDIOBOOKSHELF ---
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    ports:
      - 8085:80
    user: "${PUID}:${PGID}"
    volumes:
      - ${MEDIA_DATA_DIR}/audiobooks:/audiobooks
      - ${MEDIA_DATA_DIR}/podcasts:/podcasts
      - ${APPS_DATA_DIR}/audiobookshelf/config:/config
      - ${APPS_DATA_DIR}/audiobookshelf/metadata:/metadata
    environment:
      - TZ=Europe/Paris
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audiobookshelf.service=audiobookshelf"
      - "traefik.http.routers.audiobookshelf.rule=Host(`audiobooks.le-frigo.fr`)"
      - "traefik.http.routers.audiobookshelf.entrypoints=websecure"
      - "traefik.http.routers.audiobookshelf.tls.certresolver=myresolver"
      - "traefik.http.services.audiobookshelf.loadbalancer.server.port=80"
    networks:
      - lefrigo-net
    restart: always

volumes:
  model-cache:
  mysql_data:

networks:
  lefrigo-net:
    external: true