---
services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-proxy
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - POST=1
      - AUTH=1
      - INFO=1
      - EVENTS=1
      - PORT=1
    networks: [dockhand-internal]
    privileged: true
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    user: 1000:1000
    volumes: [./data/dockhand:/app/data]
    networks: [dockhand-internal, lefrigo-net]
    ports: [3000:3000]
networks:
  dockhand-internal:
    name: dockhand-internal
  lefrigo-net:
    driver: bridge
    name: lefrigo-net
