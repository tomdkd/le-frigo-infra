services:
  infisical-db:
    container_name: infisical-db
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_USER=${INFISICAL_DB_USER}
      - POSTGRES_PASSWORD=${INFISICAL_DB_PASSWORD}
      - POSTGRES_DB=infisical
    volumes:
      - ${APPS_DATA_DIR}/infisical/db:/var/lib/postgresql/data
    networks:
      - infisical-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 10s
      retries: 10

  infisical-redis:
    image: redis:alpine
    container_name: infisical-redis
    restart: always
    networks:
      - infisical-internal
    volumes:
      - ${APPS_DATA_DIR}/infisical/redis:/data

  infisical-backend:
    container_name: infisical-backend
    image: infisical/infisical:latest
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
    ports:
      - "10000:8080"
    environment:
      - NODE_ENV=production
      - SITE_URL=http://100.85.36.86:10000
      - DB_CONNECTION_URL=postgresql://${INFISICAL_DB_USER}:${INFISICAL_DB_PASSWORD}@infisical-db:5432/infisical
      - REDIS_URL=redis://infisical-redis:6379
      - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY}
      - AUTH_SECRET=${INFISICAL_AUTH_SECRET}
    networks:
      - infisical-internal
      - lefrigo-net

networks:
  infisical-internal:
    driver: bridge
    internal: true
  lefrigo-net:
    external: true