---
services:
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver-preprod
    restart: unless-stopped
    ports: [8978:8978]
    volumes: ['${APPS_DATA_DIR}/cloudbeaver:/opt/cloudbeaver/workspace']
    networks: [lefrigo-net, jellystat-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.cloudbeaver.rule=Host(`dbeaver.le-frigo.fr`)
      - traefik.http.routers.cloudbeaver.entrypoints=websecure
      - traefik.http.routers.cloudbeaver.tls=true
      - traefik.http.routers.cloudbeaver.tls.certresolver=myresolver
      - traefik.http.routers.cloudbeaver.service=cloudbeaver-svc
      - traefik.http.services.cloudbeaver-svc.loadbalancer.server.port=8978
      - traefik.http.routers.cloudbeaver.middlewares=tinyauth-middleware@docker,error-pages-middleware@docker
      - tinyauth.apps.cloudbeaver.ldap.groups=admin
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8978/]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  jellystat-db:
    image: postgres:18.1
    shm_size: 1gb
    container_name: jellystat-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    environment:
      POSTGRES_USER: ${JELLYSTAT_DB_USER}
      POSTGRES_PASSWORD: ${JELLYSTAT_DB_PASSWORD}
    volumes: ['${APPS_DATA_DIR}/jellystat-db:/var/lib/postgresql']
    healthcheck:
      test: [CMD-SHELL, pg_isready --dbname=postgres --username=postgres]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [jellystat-net]
  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    environment:
      POSTGRES_USER: ${JELLYSTAT_DB_USER}
      POSTGRES_PASSWORD: ${JELLYSTAT_DB_PASSWORD}
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JELLYSTAT_JWT_SECRET}
      TZ: Europe/Paris
    volumes: ['${APPS_DATA_DIR}/jellystat:/app/backend/backup-data']
    ports: [3435:3000]
    networks: [lefrigo-net, jellystat-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellystat.rule=Host(`jellystat.le-frigo.fr`)
      - traefik.http.routers.jellystat.entrypoints=websecure
      - traefik.http.routers.jellystat.tls=true
      - traefik.http.routers.jellystat.tls.certresolver=myresolver
      - traefik.http.routers.jellystat.service=jellystat-svc
      - traefik.http.services.jellystat-svc.loadbalancer.server.port=3000
      - traefik.http.routers.jellystat.middlewares=tinyauth-middleware@docker,error-pages-middleware@docker
      - tinyauth.apps.jellystat.ldap.groups=admin
    depends_on:
      jellystat-db:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/auth/isConfigured
        || exit 1
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
  beszel:
    image: henrygd/beszel
    container_name: beszel
    restart: unless-stopped
    environment:
      - APP_URL=https://monitoring.le-frigo.fr
    ports:
      - 8090:8090
    volumes:
      - ${APPS_DATA_DIR}/beszel/hub:/beszel_data
    labels:
      - traefik.enable=true
      - traefik.http.routers.beszel.rule=Host(`monitoring.le-frigo.fr`)
      - traefik.http.routers.beszel.entrypoints=websecure
      - traefik.http.routers.beszel.tls=true
      - traefik.http.routers.beszel.tls.certresolver=myresolver
      - traefik.http.routers.beszel.service=beszel-svc
      - traefik.http.services.beszel-svc.loadbalancer.server.port=8090
      - traefik.http.routers.beszel.middlewares=error-pages-middleware@docker
    healthcheck:
      test: ['CMD', '/beszel', 'health', '--url', 'http://localhost:8090']
      interval: 120s
      start_period: 10s
      timeout: 5s
  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${APPS_DATA_DIR}/beszel/agent:/var/lib/beszel-agent
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      # - /mnt/disk/.beszel:/extra-filesystems/sda1:ro
    environment:
      LISTEN: 45876
      KEY: ${BESZEL_AGENT_KEY}
      TOKEN: ${BESZEL_AGENT_TOKEN}
      HUB_URL: https://monitoring.le-frigo.fr
networks:
  lefrigo-net:
    external: true
  jellystat-net:
