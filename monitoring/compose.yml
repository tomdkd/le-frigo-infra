---
services:
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver-preprod
    restart: unless-stopped
    ports: [8978:8978]
    volumes: ['${APPS_DATA_DIR}/cloudbeaver:/opt/cloudbeaver/workspace']
    networks: [lefrigo-net, jellystat-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.cloudbeaver.rule=Host(`dbeaver.le-frigo.fr`)
      - traefik.http.routers.cloudbeaver.entrypoints=websecure
      - traefik.http.routers.cloudbeaver.tls=true
      - traefik.http.routers.cloudbeaver.tls.certresolver=myresolver
      - traefik.http.routers.cloudbeaver.service=cloudbeaver-svc
      - traefik.http.services.cloudbeaver-svc.loadbalancer.server.port=8978
      - traefik.http.routers.cloudbeaver.middlewares=tinyauth-middleware@docker,error-pages-middleware@docker
      - tinyauth.apps.cloudbeaver.ldap.groups=admin
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8978/]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  jellystat-db:
    image: postgres:18.1
    shm_size: 1gb
    container_name: jellystat-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    environment:
      POSTGRES_USER: ${JELLYSTAT_DB_USER}
      POSTGRES_PASSWORD: ${JELLYSTAT_DB_PASSWORD}
    volumes: ['${APPS_DATA_DIR}/jellystat-db:/var/lib/postgresql']
    healthcheck:
      test: [CMD-SHELL, pg_isready --dbname=postgres --username=postgres]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [jellystat-net]
  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: '5'
        max-size: 10m
    environment:
      POSTGRES_USER: ${JELLYSTAT_DB_USER}
      POSTGRES_PASSWORD: ${JELLYSTAT_DB_PASSWORD}
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JELLYSTAT_JWT_SECRET}
      TZ: Europe/Paris
    volumes: ['${APPS_DATA_DIR}/jellystat:/app/backend/backup-data']
    ports: [3435:3000]
    networks: [lefrigo-net, jellystat-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellystat.rule=Host(`jellystat.le-frigo.fr`)
      - traefik.http.routers.jellystat.entrypoints=websecure
      - traefik.http.routers.jellystat.tls=true
      - traefik.http.routers.jellystat.tls.certresolver=myresolver
      - traefik.http.routers.jellystat.service=jellystat-svc
      - traefik.http.services.jellystat-svc.loadbalancer.server.port=3000
      - traefik.http.routers.jellystat.middlewares=tinyauth-middleware@docker,error-pages-middleware@docker
      - tinyauth.apps.jellystat.ldap.groups=admin
    depends_on:
      jellystat-db:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/auth/isConfigured
        || exit 1
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes: [dozzle_data:/data]
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
      - DOZZLE_ENABLE_SHELL=true
      - DOZZLE_HOSTNAME=le-frigo.fr
      - DOZZLE_REMOTE_AGENT=dozzle-agent:7007
    labels:
      - traefik.enable=true
      - traefik.http.routers.dozzle.rule=Host(`dozzle.le-frigo.fr`)
      - traefik.http.routers.dozzle.entrypoints=websecure
      - traefik.http.routers.dozzle.tls=true
      - traefik.http.routers.dozzle.tls.certresolver=myresolver
      - traefik.http.routers.dozzle.service=dozzle-svc
      - traefik.http.services.dozzle-svc.loadbalancer.server.port=8080
      - traefik.http.routers.dozzle.middlewares=tinyauth-middleware@docker,error-pages-middleware@docker
      - tinyauth.apps.dozzle.ldap.groups=admin
    healthcheck:
      test: [CMD, /dozzle, healthcheck]
      interval: 3s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks: [lefrigo-net]
  dozzle-agent:
    image: amir20/dozzle:latest
    container_name: dozzle-agent
    command: agent
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
    ports: [7007:7007]
    networks: [lefrigo-net]
  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8
    container_name: crowdsec
    restart: unless-stopped
    # user: ${PUID}:${PGID}
    environment:
      - GID=568
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios
      - CUSTOM_HOSTNAME=traefik
    volumes:
      - ${APPS_DATA_DIR}/traefik/logs:/var/log/traefik:ro
      - ${APPS_DATA_DIR}/crowdsec/data:/var/lib/crowdsec/data
      - ${APPS_DATA_DIR}/crowdsec/config:/etc/crowdsec
    networks: [lefrigo-net]
  backrest:
    image: ghcr.io/garethgeorge/backrest:latest
    container_name: backrest
    hostname: backrest
    user: ${PUID}:${PGID}
    volumes:
      - ${APPS_DATA_DIR}/backrest/data:/data
      - ${APPS_DATA_DIR}/backrest/config:/config
      - ${APPS_DATA_DIR}/backrest/cache:/cache
      - ${APPS_DATA_DIR}/backrest/tmp:/tmp
      - ${APPS_DATA_DIR}/backrest/rclone:/root/.config/rclone
      - ${MEDIA_DATA_DIR}:/userdata
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
      - TZ=Europe/Paris
    ports: [9898:9898]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.backrest.rule=Host(`backup.le-frigo.fr`)
      - traefik.http.routers.backrest.entrypoints=websecure
      - traefik.http.routers.backrest.tls=true
      - traefik.http.routers.backrest.tls.certresolver=myresolver
      - traefik.http.routers.backrest.service=backrest-svc
      - traefik.http.services.backrest-svc.loadbalancer.server.port=9898
      - traefik.http.routers.backrest.middlewares=tinyauth-middleware@docker,error-pages-middleware@docker
      - tinyauth.apps.backrest.ldap.groups=admin
  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    volumes: ['${APPS_DATA_DIR}/uptime-kuma:/app/data']
    ports: [3001:3001]
    networks: [lefrigo-net, traefik-proxy-net]
volumes:
  dozzle_data:
networks:
  lefrigo-net:
    external: true
  traefik-proxy-net:
    external: true
  jellystat-net:
