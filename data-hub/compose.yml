  # ==========================================
  #  NETWORK & DOWNLOAD
  # ==========================================
  gluetun:
    image: qmcgaw/gluetun:pr-3361
    container_name: gluetun
    user: 0:0
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${VPN_WG_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${VPN_WG_ADDRESS}
      - SERVER_NAMES=LT#38
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=${VPN_PROVIDER}
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24,172.16.0.0/12
      - HEALTH_RESTART_VPN=no
      - HEALTH_INITIAL_DELAY=30s
      - DNS_ADDRESS=8.8.8.8
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data
        "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences
        2>&1'
    ports: [18080:8080, 18001:8000]
    restart: always
    networks: [lefrigo-net]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: [CMD-SHELL, wget -qO- https://google.com || exit 1]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.1
    container_name: qbittorrent
    network_mode: service:gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Paris
      - WEBUI_PORT=8080
    volumes:
      - ${APPS_DATA_DIR}/qbittorrent/config:/config
      - ${MEDIA_DATA_DIR}:/data
    depends_on:
      gluetun:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://localhost:8080/ || exit 1]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
  qbitwebui:
    image: ghcr.io/mkbula/qbitwebui:latest
    container_name: qbitwebui
    user: ${PUID}:${PGID}
    environment:
      - ENCRYPTION_KEY=${QBITWEBUI_ENCRYPTION_KEY}
      - DISABLE_REGISTRATION=true
      - DOWNLOADS_PATH=/downloads
    volumes:
      - ${APPS_DATA_DIR}/qbitwebui/data:/data
      - ${MEDIA_DATA_DIR}/downloads:/downloads:ro
    restart: unless-stopped
    networks: [lefrigo-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbitwebui.rule=Host(`torrent.le-frigo.fr`)
      - traefik.http.routers.qbitwebui.service=qbitwebui-svc
      - traefik.http.routers.qbitwebui.entrypoints=websecure
      - traefik.http.routers.qbitwebui.tls.certresolver=myresolver
      - traefik.http.services.qbitwebui-svc.loadbalancer.server.port=3000
      - traefik.http.routers.qbitwebui.middlewares=tinyauth-middleware@docker,error-pages-middleware@docker
      - tinyauth.apps.qbitwebui.ldap.groups=admin
  net-agent:
    image: ghcr.io/mkbula/qbitwebui-agent:latest
    container_name: net-agent
    network_mode: service:gluetun
    environment:
      - QBT_URL=http://localhost:8080
    depends_on:
      qbittorrent:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  # ==========================================
  #  AUTOMATION PIPELINE
  # ==========================================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.1-nightly
    container_name: prowlarr
    environment: ['PUID=${PUID}', 'PGID=${PGID}', TZ=Europe/Paris]
    networks: [lefrigo-net]
    ports: [9696:9696]
    volumes: ['${APPS_DATA_DIR}/prowlarr:/config']
    depends_on:
      gluetun:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://localhost:9696/ || exit 1]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0-nightly
    container_name: radarr
    environment: ['PUID=${PUID}', 'PGID=${PGID}', TZ=Europe/Paris]
    ports: [7878:7878]
    volumes: ['${APPS_DATA_DIR}/radarr:/config', '${MEDIA_DATA_DIR}:/data']
    restart: always
    networks: [lefrigo-net]
    depends_on:
      prowlarr:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://localhost:7878/ || exit 1]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: sonarr
    environment: ['PUID=${PUID}', 'PGID=${PGID}', TZ=Europe/Paris]
    ports: [8989:8989]
    volumes: ['${APPS_DATA_DIR}/sonarr:/config', '${MEDIA_DATA_DIR}:/data']
    restart: always
    networks: [lefrigo-net]
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://localhost:8989/ || exit 1]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      prowlarr:
        condition: service_healthy
  ygege:
    image: uwucode/ygege:0.9.1
    container_name: ygege
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    networks: [lefrigo-net]
    ports: [18715:8715]
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail http://localhost:$${BIND_PORT:-8715}/health || exit 1
      interval: 1m30s
      timeout: 20s
      retries: 3
      start_period: 10s
    depends_on:
      gluetun:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
  shelfmark:
    image: ghcr.io/calibrain/shelfmark:v1.3.2
    container_name: shelfmark
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: Europe/Paris
    ports: [8084:8084]
    restart: unless-stopped
    volumes:
      - ${MEDIA_DATA_DIR}/books:/books
      - ${APPS_DATA_DIR}/shelfmark/config:/config
      - ${MEDIA_DATA_DIR}:/data
    networks: [lefrigo-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.shelfmark.rule=Host(`shelfmark.le-frigo.fr`)
      - traefik.http.routers.shelfmark.service=shelfmark
      - traefik.http.routers.shelfmark.entrypoints=websecure
      - traefik.http.routers.shelfmark.tls.certresolver=myresolver
      - traefik.http.services.shelfmark.loadbalancer.server.port=8084
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
        reservations:
          memory: 256M
    depends_on:
      prowlarr:
        condition: service_healthy
  metube:
    image: alexta69/metube:2026.06.06
    user: ${PUID}:${PGID}
    container_name: metube
    restart: unless-stopped
    volumes: ['${MEDIA_DATA_DIR}/youtube_downloads:/downloads']
    networks: [lefrigo-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.metube.rule=Host(`metube.le-frigo.fr`)
      - traefik.http.routers.metube.service=metube-svc
      - traefik.http.routers.metube.entrypoints=websecure
      - traefik.http.routers.metube.tls.certresolver=myresolver
      - traefik.http.services.metube-svc.loadbalancer.server.port=8081
      - traefik.http.routers.metube.middlewares=tinyauth-middleware@docker,error-pages-middleware@docker
      - tinyauth.apps.metube.ldap.groups=admin

  # ==========================================
  #  VIDEO STREAMING & MEDIA MANAGEMENT
  # ==========================================
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      - TZ=Europe/Paris
      - JELLYFIN_PublishedServerUrl=https://stream.le-frigo.fr
    volumes:
      - ${APPS_DATA_DIR}/jellyfin:/config
      - ${MEDIA_DATA_DIR}/films:/films
      - ${MEDIA_DATA_DIR}/series:/series
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`stream.le-frigo.fr`)
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.tls.certresolver=myresolver
      - traefik.http.services.jellyfin-svc.loadbalancer.server.port=8096
      - traefik.http.routers.jellyfin.middlewares=error-pages-middleware@docker
      - traefik.providers.docker.network=lefrigo-net
    networks: [lefrigo-net, data-hub-net, lldap-auth-net]
    deploy:
      resources:
        limits:
          cpus: '4.00'
          memory: 4096M
