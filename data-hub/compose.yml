networks:
  lefrigo-net:
    external: true
  data-hub-net:
    name: data-hub-net
  data-hub-db-net:
    name: data-hub-db-net
  data-hub-redis-net:
    name: data-hub-redis-net
  lldap-auth-net:
    external: true
