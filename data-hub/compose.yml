---
services:
  # ==========================================
  #  DATA
  # ==========================================
  postgres-media:
    image: postgres:16-alpine
    container_name: postgres-media-preprod
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${MEDIA_POSTGRES_USER}
      - POSTGRES_PASSWORD=${MEDIA_POSTGRES_PASSWORD}
      - POSTGRES_DB=immich
    volumes: ['${APPS_DATA_DIR}/postgres-media:/var/lib/postgresql/data']
    networks: [data-hub-db-net]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB]
      interval: 10s
      timeout: 5s
      retries: 5
  redis-media:
    image: redis:8.6.1
    container_name: redis-media-preprod
    restart: always
    networks: [data-hub-redis-net]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 30s
      retries: 3

  # ==========================================
  #  NETWORK & DOWNLOAD
  # ==========================================
  gluetun:
    image: qmcgaw/gluetun:pr-3361
    container_name: gluetun-preprod
    user: 0:0
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${VPN_WG_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${VPN_WG_ADDRESS}
      - SERVER_NAMES=LT#38
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=${VPN_PROVIDER}
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24,172.16.0.0/12
      - HEALTH_RESTART_VPN=no
      - HEALTH_INITIAL_DELAY=30s
      - DNS_ADDRESS=8.8.8.8
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data
        "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences
        2>&1'
    ports: [8080:8080, 8001:8000]
    restart: always
    networks: [lefrigo-net]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: [CMD-SHELL, wget -qO- https://google.com || exit 1]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.1
    container_name: qbittorrent-preprod
    network_mode: service:gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Paris
      - WEBUI_PORT=8080
    volumes:
      - ${APPS_DATA_DIR}/qbitorrent/config:/config
      - ${MEDIA_DATA_DIR}:/data
    depends_on:
      gluetun:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://localhost:8080/ || exit 1]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
  qbitwebui:
    image: ghcr.io/mkbula/qbitwebui:latest
    ports: [8081:3000]
    environment:
      - ENCRYPTION_KEY=${QBITWEBUI_ENCRYPTION_KEY}
      - DISABLE_REGISTRATION=true
      - DOWNLOADS_PATH=/downloads
    volumes:
      - ${APPS_DATA_DIR}/qbitwebui/data:/data
      - ${MEDIA_DATA_DIR}/downloads:/downloads:ro
    restart: unless-stopped
    networks: [lefrigo-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbitwebui.rule=Host(`torrent.preprod.le-frigo.fr`)
      - traefik.http.routers.qbitwebui.service=qbitwebui
      - traefik.http.routers.qbitwebui.entrypoints=websecure
      - traefik.http.routers.qbitwebui.tls.certresolver=myresolver
      - traefik.http.services.qbitwebui.loadbalancer.server.port=3000
      - traefik.http.routers.qbitwebui.middlewares=tinyauth@docker,error-pages-middleware@docker
      - tinyauth.apps.qbitwebui.ldap.groups=admin
  # ==========================================
  #  AUTOMATION PIPELINE
  # ==========================================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.4.0-nightly
    container_name: prowlarr-preprod
    environment: ['PUID=${PUID}', 'PGID=${PGID}', TZ=Europe/Paris]
    networks: [lefrigo-net]
    ports: [9696:9696]
    volumes: ['${APPS_DATA_DIR}/prowlarr:/config']
    depends_on:
      gluetun:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://localhost:9696/ || exit 1]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
  radarr:
    image: lscr.io/linuxserver/radarr:6.2.1-nightly
    container_name: radarr-preprod
    ports: [7878:7878]
    environment: ['PUID=${PUID}', 'PGID=${PGID}', TZ=Europe/Paris]
    volumes: ['${APPS_DATA_DIR}/radarr:/config', '${MEDIA_DATA_DIR}:/data']
    restart: always
    networks: [lefrigo-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.preprod.le-frigo.fr`)
      - traefik.http.routers.radarr.service=radarr
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls.certresolver=myresolver
      - traefik.http.routers.radarr.middlewares=tinyauth@docker,error-pages-middleware@docker
      - traefik.http.services.radarr.loadbalancer.server.port=7878
      - tinyauth.apps.radarr.ldap.groups=admin
    depends_on:
      prowlarr:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://localhost:7878/ || exit 1]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.17
    container_name: sonarr-preprod
    ports: [8989:8989]
    environment: ['PUID=${PUID}', 'PGID=${PGID}', TZ=Europe/Paris]
    volumes: ['${APPS_DATA_DIR}/sonarr:/config', '${MEDIA_DATA_DIR}:/data']
    restart: always
    networks: [lefrigo-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.preprod.le-frigo.fr`)
      - traefik.http.routers.sonarr.service=sonarr
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls.certresolver=myresolver
      - traefik.http.routers.sonarr.middlewares=tinyauth@docker,error-pages-middleware@docker
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
      - tinyauth.apps.sonarr.ldap.groups=admin
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: [CMD-SHELL, wget -q --spider http://localhost:8989/ || exit 1]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      prowlarr:
        condition: service_healthy
  ygege:
    image: uwucode/ygege:0.9.1
    container_name: ygege-preprod
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    networks: [lefrigo-net]
    ports: [8715:8715]
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail http://localhost:$${BIND_PORT:-8715}/health || exit 1
      interval: 1m30s
      timeout: 20s
      retries: 3
      start_period: 10s
    depends_on:
      gluetun:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
  metube:
    image: alexta69/metube:2026.06.06
    user: ${PUID}:${PGID}
    container_name: metube-preprod
    restart: unless-stopped
    ports: [8086:8081]
    volumes: ['${MEDIA_DATA_DIR}/youtube_downloads:/downloads']
    networks: [lefrigo-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.metube.rule=Host(`metube.preprod.le-frigo.fr`)
      - traefik.http.routers.metube.service=metube
      - traefik.http.routers.metube.entrypoints=websecure
      - traefik.http.routers.metube.tls.certresolver=myresolver
      - traefik.http.services.metube.loadbalancer.server.port=8081
      - traefik.http.routers.metube.middlewares=tinyauth@docker,error-pages-middleware@docker
      - tinyauth.apps.metube.ldap.groups=admin
  # ==========================================
  #  VIDEO STREAMING & MEDIA MANAGEMENT
  # ==========================================
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin-preprod
    restart: unless-stopped
    user: ${PUID}:${PGID}
    ports: [8096:8096/tcp, 7359:7359/udp]
    environment:
      - TZ=Europe/Paris
      - JELLYFIN_PublishedServerUrl=https://stream.preprod.le-frigo.fr
    volumes:
      - ${APPS_DATA_DIR}/jellyfin:/config
      - ${MEDIA_DATA_DIR}/films:/films
      - ${MEDIA_DATA_DIR}/series:/series
      - ${MEDIA_DATA_DIR}/stuck_in_yesterday:/stuck_in_yesterday
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.preprod.le-frigo.fr`)
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.routers.jellyfin.tls.certresolver=myresolver
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
      - traefik.http.routers.jellyfin.middlewares=error-pages-middleware@docker
      - tinyauth.apps.jellyfin.ldap.groups=user,admin
    networks: [lefrigo-net, data-hub-net]
    deploy:
      resources:
        limits:
          cpus: '4.00'
          memory: 4096M
  immich-server:
    image: ghcr.io/immich-app/immich-server:commit-dc2c01e4737eb6524d1d4a16ee47ffac16264111
    container_name: immich_server-preprod
    user: ${PUID}:${PGID}
    ports: [2283:2283]
    volumes:
      - ${MEDIA_DATA_DIR}/photos:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=postgres-media
      - DB_USERNAME=${MEDIA_POSTGRES_USER}
      - DB_PASSWORD=${MEDIA_POSTGRES_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=redis-media
      - TZ=Europe/Paris
    healthcheck:
      disable: false
    depends_on:
      postgres-media:
        condition: service_healthy
      redis-media:
        condition: service_healthy
    networks: [lefrigo-net, data-hub-db-net, data-hub-redis-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.immich.service=immich
      - traefik.http.routers.immich.rule=Host(`immich.preprod.le-frigo.fr`)
      - traefik.http.routers.immich.entrypoints=websecure
      - traefik.http.routers.immich.tls.certresolver=myresolver
      - traefik.http.services.immich.loadbalancer.server.port=2283
      - traefik.http.routers.immich.middlewares=error-pages-middleware@docker
      - tinyauth.apps.immich.ldap.groups=admin
    deploy:
      resources:
        limits:
          cpus: '4.00'
          memory: 4096M
  # ==========================================
  #  MUSIC, AUDIO & PODCASTS
  # ==========================================
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.35.1
    container_name: audiobookshelf-preprod
    ports: [8085:80]
    user: ${PUID}:${PGID}
    volumes:
      - ${APPS_DATA_DIR}/audiobookshelf/config:/config
      - ${APPS_DATA_DIR}/audiobookshelf/metadata:/metadata
      - ${MEDIA_DATA_DIR}/books:/data
    environment: [TZ=Europe/Paris]
    labels:
      - traefik.enable=true
      - traefik.http.routers.audiobookshelf.service=audiobookshelf
      - traefik.http.routers.audiobookshelf.rule=Host(`audiobooks.preprod.le-frigo.fr`)
      - traefik.http.routers.audiobookshelf.entrypoints=websecure
      - traefik.http.routers.audiobookshelf.tls.certresolver=myresolver
      - traefik.http.services.audiobookshelf.loadbalancer.server.port=80
      - tinyauth.apps.audiobookshelf.ldap.groups=user,admin
      - traefik.http.routers.audiobookshelf.middlewares=error-pages-middleware@docker
    networks: [lefrigo-net]
    restart: always
  gonic:
    image: sentriz/gonic:v0.22.0
    container_name: gonic-preprod
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment: [TZ=Europe/Paris, GONIC_SCAN_INTERVAL=15]
    ports: [4747:80]
    volumes:
      - ${APPS_DATA_DIR}/gonic/data:/data
      - ${MEDIA_DATA_DIR}/musique:/music:ro
      - ${APPS_DATA_DIR}/gonic/playlists:/playlists
      - ${APPS_DATA_DIR}/gonic/cache:/cache
      - ${APPS_DATA_DIR}/gonic/podcasts:/podcasts
    security_opt: [no-new-privileges:true]
    labels:
      - traefik.enable=true
      - traefik.http.routers.gonic-api.rule=Host(`music.api.preprod.le-frigo.fr`)
      - traefik.http.routers.gonic-api.entrypoints=websecure
      - traefik.http.routers.gonic-api.tls=true
      - traefik.http.routers.gonic-api.tls.certresolver=myresolver
      - traefik.http.routers.gonic-api.service=gonic-svc
      - traefik.http.routers.gonic-api.middlewares=gonic-cors
      - traefik.http.services.gonic-svc.loadbalancer.server.port=80
      - traefik.http.middlewares.gonic-cors.headers.accesscontrolallowmethods=GET,OPTIONS,POST
      - traefik.http.middlewares.gonic-cors.headers.accesscontrolalloworiginlist=https://music.preprod.le-frigo.fr
      - traefik.http.middlewares.gonic-cors.headers.accesscontrolallowheaders=*
      - tinyauth.apps.gonic.ldap.groups=user,admin
      - traefik.http.routers.gonic-api.middlewares=error-pages-middleware@docker
    networks: [lefrigo-net]
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:80/ping]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
  vibrdrome-web:
    image: ddmoney420/vibrdrome-web:v1.8.1-beta.2
    container_name: vibrdrome-web-preprod
    ports: [8009:80]
    environment: [VIBRDROME_DEFAULT_SERVER=https://music.api.preprod.le-frigo.fr]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.vibrdrome.rule=Host(`music.le-frigo.fr`)
      - traefik.http.routers.vibrdrome.entrypoints=websecure
      - traefik.http.routers.vibrdrome.tls=true
      - traefik.http.routers.vibrdrome.tls.certresolver=myresolver
      - traefik.http.routers.vibrdrome.service=vibrdrome-svc
      - traefik.http.services.vibrdrome-svc.loadbalancer.server.port=80
      - traefik.http.routers.vibrdrome.middlewares=tinyauth@docker,error-pages-middleware@docker
      - tinyauth.apps.vibrdrome.ldap.groups=user,admin
    security_opt: [no-new-privileges:true]
    depends_on: [gonic]
    networks: [lefrigo-net]
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
networks:
  lefrigo-net:
    external: true
  data-hub-net:
    name: data-hub-net
  data-hub-db-net:
    name: data-hub-db-net
  data-hub-redis-net:
    name: data-hub-redis-net
