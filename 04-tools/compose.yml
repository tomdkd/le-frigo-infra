services:
  # --- PGADMIN ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${ADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    networks:
      - lefrigo-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.le-frigo.fr`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=myresolver"
      - "traefik.http.routers.pgadmin.middlewares=authentik@docker"

  # --- BENTOPDF ---
  bentopdf:
    image: ghcr.io/alam00000/bentopdf-simple:2.2.1
    container_name: bentopdf
    ports:
      - "3250:8080"
    restart: unless-stopped
    networks:
      - lefrigo-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pdf.rule=Host(`pdf.le-frigo.fr`)"
      - "traefik.http.routers.pdf.service=pdf"
      - "traefik.http.routers.pdf.entrypoints=websecure"
      - "traefik.http.routers.pdf.tls.certresolver=myresolver"
      - "traefik.http.routers.pdf.middlewares=authentik@docker"
      - "traefik.http.services.pdf.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 20s

  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command:
      - serve
    environment:
      - TZ=Europe/Paris
      - NTFY_BASE_URL=https://notification.le-frigo.fr
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_ATTACHMENT_CACHE_DIR=/var/lib/ntfy/attachments
      - NTFY_ENABLE_LOGIN=true
    user: 3005:568
    volumes:
      - ${APPS_DATA_DIR}/ntfy/cache:/var/cache/ntfy
      - ${APPS_DATA_DIR}/ntfy/storage:/var/lib/ntfy
    ports:
      - 3002:80
    healthcheck:
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    restart: unless-stopped
    init: true
    networks:
      - lefrigo-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notif.rule=Host(`notification.le-frigo.fr`)"
      - "traefik.http.routers.notif.entrypoints=websecure"
      - "traefik.http.routers.notif.tls=true"
      - "traefik.http.routers.notif.tls.certresolver=myresolver"
      - "traefik.http.services.notif.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M
        reservations:
          memory: 64M

  # --- FILEBROWSER ---
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    volumes:
      - ${MEDIA_DATA_DIR}:/srv/data
      - ${MEDIA_DATA_DIR}:/srv/media
      - ${APPS_DATA_DIR}/filebrowser/config:/config
      - ${APPS_DATA_DIR}/filebrowser/database:/database
    networks:
      - lefrigo-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: [ 
      "--address", "0.0.0.0", 
      "--noauth",
      "--port", "8080", 
      "--database", "/database/filebrowser.db", 
      "--root", "/srv" 
    ]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.filebrowser.rule=Host(`files.le-frigo.fr`)"
      - "traefik.http.routers.filebrowser.entrypoints=websecure"
      - "traefik.http.routers.filebrowser.tls.certresolver=myresolver"
      - "traefik.http.routers.filebrowser.middlewares=authentik@docker"

  # --- WALLOS ---
  wallos:
    image: bellamy/wallos:latest
    container_name: wallos
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
    volumes:
      - ${APPS_DATA_DIR}/wallos/db:/var/www/html/db
      - ${APPS_DATA_DIR}/wallos/logos:/var/www/html/images/uploads/logos
    networks:
      - lefrigo-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wallos.rule=Host(`wallos.le-frigo.fr`)"
      - "traefik.http.routers.wallos.entrypoints=websecure"
      - "traefik.http.routers.wallos.tls.certresolver=myresolver"
      - "traefik.http.routers.wallos.middlewares=authentik@docker"

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    user: "${PUID}:${PGID}"
    container_name: jellyseerr
    ports:
      - 5055:5055
    volumes:
      - ${APPS_DATA_DIR}/jellyseer/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Paris
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.le-frigo.fr`)"
      - "traefik.http.routers.jellyseerr.entrypoints=websecure"
      - "traefik.http.routers.jellyseerr.tls.certresolver=myresolver"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"
    networks:
      - lefrigo-net
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
        reservations:
          memory: 512M

networks:
  lefrigo-net:
    external: true