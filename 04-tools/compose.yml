  #     # --- common ---
  #     - "traefik.http.services.filebrowser.loadbalancer.server.port=8080"

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    user: "${PUID}:${PGID}"
    container_name: jellyseerr
    ports:
      - 5055:5055
    volumes:
      - ${APPS_DATA_DIR}/jellyseer/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Paris
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.le-frigo.fr`)"
      - "traefik.http.routers.jellyseerr.entrypoints=websecure"
      - "traefik.http.routers.jellyseerr.tls.certresolver=myresolver"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"
    networks:
      - lefrigo-net
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
        reservations:
          memory: 512M

  # --- OUTLINE ---
  outline:
    image: docker.getoutline.com/outlinewiki/outline:latest
    container_name: outline
    restart: always
    user: ${PUID}:${PGID}
    networks:
      - lefrigo-net
    environment:
      NODE_ENV: production
      SECRET_KEY: ${OUTLINE_SECRET_KEY}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET}
      URL: https://doc.le-frigo.fr
      PORT: 3421
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-common:5432/outline
      REDIS_URL: redis://common-redis:6379/1
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_AUTH_URI: https://auth.le-frigo.fr/application/o/authorize/
      OIDC_TOKEN_URI: https://auth.le-frigo.fr/application/o/token/
      OIDC_USERINFO_URI: https://auth.le-frigo.fr/application/o/userinfo/
      OIDC_DISPLAY_NAME: LeFrigo
      FORCE_HTTPS: true
      ENABLE_SSL_VERIFICATION: true
      PGSSLMODE: disable
      HOST: 0.0.0.0
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FILE_STORAGE: local
      FILE_STORAGE_UPLOAD_MAX_SIZE: 26214400
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.outline.service=outline"
      - "traefik.http.routers.outline.rule=Host(`doc.le-frigo.fr`)"
      - "traefik.http.routers.outline.entrypoints=websecure"
      - "traefik.http.routers.outline.tls.certresolver=myresolver"
      - "traefik.http.services.outline.loadbalancer.server.port=3421"

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    ports:
      - "8123:8123"
    volumes:
      - ${APPS_DATA_DIR}/homeassistant/config:/config
      - ${APPS_DATA_DIR}/homeassistant/storage:/var/lib/homeassistant
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    networks:
      - lefrigo-net
    environment:
      TZ: Europe/Paris
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homeassistant.service=homeassistant"
      - "traefik.http.routers.homeassistant.rule=Host(`house.le-frigo.fr`)"
      - "traefik.http.routers.homeassistant.entrypoints=websecure"
      - "traefik.http.routers.homeassistant.tls.certresolver=myresolver"
      - "traefik.http.services.homeassistant.loadbalancer.server.port=8123"
      - "traefik.http.routers.homeassistant.priority=1"

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.16.0 # 
    container_name: mealie
    restart: always
    ports:
        - "9925:9000"
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - ${APPS_DATA_DIR}/mealie/data:/app/data/
    networks:
      - lefrigo-net
    environment:
      - "ALLOW_SIGNUP=false"
      - "PUID=${PUID}"
      - "PGID=${PGID}"
      - "TZ=Europe/Paris"
      - "BASE_URL=https://mealie.le-frigo.fr"
      - "DB_ENGINE=postgres"
      - "POSTGRES_USER=${POSTGRES_MEALIE_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_MEALIE_PASSWORD}"
      - "POSTGRES_SERVER=postgres-common"
      - "POSTGRES_PORT=5432"
      - "POSTGRES_DB=mealie"
      - "OIDC_AUTH_ENABLED=true"
      - "OIDC_SIGNUP_ENABLED=true"
      - "OIDC_CONFIGURATION_URL=https://auth.le-frigo.fr/application/o/mealie/.well-known/openid-configuration"
      - "OIDC_CLIENT_ID=${MEALIE_OIDC_ID}"
      - "OIDC_CLIENT_SECRET=${MEALIE_OIDC_SECRET}"
      - "OIDC_AUTO_REDIRECT=true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mealie.rule=Host(`mealie.le-frigo.fr`)"
      - "traefik.http.routers.mealie.entrypoints=websecure"
      - "traefik.http.routers.mealie.tls.certresolver=myresolver"
      - "traefik.http.services.mealie.loadbalancer.server.port=9000"
      - "traefik.http.routers.mealie.priority=1"

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Paris
    volumes:
      - ${APPS_DATA_DIR}/code-server/config:/config
      - ${APPS_DATA_DIR}:/projects
    ports:
      - 8443:8443
    restart: unless-stopped

  opencloud:
    image: opencloudeu/opencloud-rolling:6.1.0
    container_name: opencloud
    entrypoint: ["/bin/sh"]
    command: ["-c", "opencloud init || true; opencloud server"]
    environment:
      OC_JWT_SECRET: ${OC_JWT_SECRET}
      OC_TRANSFER_SECRET: ${OC_TRANSFER_SECRET}
      OC_MACHINE_AUTH_API_KEY: ${OC_MACHINE_AUTH_API_KEY}
      IDM_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      OC_SYSTEM_USER_ID: da513904-7932-4740-975c-3406201e7492

      OC_INSECURE: "true"
      OC_CONTAINER_UID: ${PUID}
      OC_CONTAINER_GID: ${PGID}
      OC_URL: https://cloud.le-frigo.fr
      OC_DEFAULT_LANGUAGE: fr
      OC_CONFIG_DIR: /etc/opencloud
      OC_DATA_DIR: /var/lib/opencloud
      PROXY_TLS: "false"

      OC_ADD_RUN_SERVICES: ${START_ADDITIONAL_SERVICES}
      OC_LOG_LEVEL: ${LOG_LEVEL:-info}
      OC_LOG_COLOR: "${LOG_PRETTY:-false}"
      OC_LOG_PRETTY: "${LOG_PRETTY:-false}"
      FRONTEND_ARCHIVER_MAX_SIZE: "10000000000"
      FRONTEND_CHECK_FOR_UPDATES: "${CHECK_FOR_UPDATES:-true}"
      PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yaml
      OC_PASSWORD_POLICY_BANNED_PASSWORDS_LIST: banned-password-list.txt
      OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD: "${OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD:-true}"
      OC_SHARING_PUBLIC_WRITEABLE_SHARE_MUST_HAVE_PASSWORD: "${OC_SHARING_PUBLIC_WRITEABLE_SHARE_MUST_HAVE_PASSWORD:-false}"
      OC_PASSWORD_POLICY_DISABLED: "${OC_PASSWORD_POLICY_DISABLED:-false}"
      OC_PASSWORD_POLICY_MIN_CHARACTERS: "${OC_PASSWORD_POLICY_MIN_CHARACTERS:-8}"
      OC_PASSWORD_POLICY_MIN_LOWERCASE_CHARACTERS: "${OC_PASSWORD_POLICY_MIN_LOWERCASE_CHARACTERS:-1}"
      OC_PASSWORD_POLICY_MIN_UPPERCASE_CHARACTERS: "${OC_PASSWORD_POLICY_MIN_UPPERCASE_CHARACTERS:-1}"
      OC_PASSWORD_POLICY_MIN_DIGITS: "${OC_PASSWORD_POLICY_MIN_DIGITS:-1}"
      OC_PASSWORD_POLICY_MIN_SPECIAL_CHARACTERS: "${OC_PASSWORD_POLICY_MIN_SPECIAL_CHARACTERS:-1}"
    volumes:
      - ${APPS_DATA_DIR}/opencloud/config:/etc/opencloud
      - ${MEDIA_DATA_DIR}/cloud:/var/lib/opencloud
    networks:
      - lefrigo-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.opencloud.rule=Host(`cloud.le-frigo.fr`)"
      - "traefik.http.routers.opencloud.entrypoints=websecure"
      - "traefik.http.routers.opencloud.tls.certresolver=myresolver"
      - "traefik.http.services.opencloud.loadbalancer.server.port=9200"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  lefrigo-net:
    external: true

volumes:
  changedetection-data:
  n8n_data: