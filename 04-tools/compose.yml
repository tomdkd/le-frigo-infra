  #   healthcheck:
  #     test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #   command: [ 
  #     "--address", "0.0.0.0", 
  #     "--noauth",
  #     "--port", "8080", 
  #     "--database", "/database/filebrowser.db", 
  #     "--root", "/srv" 
  #   ]
  #   labels:
  #     - "traefik.enable=true"
  #     # --- Router 1 ---
