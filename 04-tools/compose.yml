services:
  # --- PGADMIN ---
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
     - "5050:8080"
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${ADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 8080
    volumes:
     - ${APPS_DATA_DIR}/pgadmin/data:/var/lib/pgadmin
    networks:
      - lefrigo-net

  # --- BENTOPDF ---
  bentopdf:
    image: ghcr.io/alam00000/bentopdf-simple:2.2.1
    container_name: bentopdf
    ports:
      - "3250:8080"
    restart: unless-stopped
    networks:
      - lefrigo-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pdf.rule=Host(`pdf.le-frigo.fr`)"
      - "traefik.http.routers.pdf.service=pdf"
      - "traefik.http.routers.pdf.entrypoints=websecure"
      - "traefik.http.routers.pdf.tls.certresolver=myresolver"
      - "traefik.http.routers.pdf.middlewares=authentik@docker"
      - "traefik.http.services.pdf.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 20s

  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command:
      - serve
    environment:
      - TZ=Europe/Paris
      - NTFY_BASE_URL=https://notification.le-frigo.fr
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_ATTACHMENT_CACHE_DIR=/var/lib/ntfy/attachments
      - NTFY_ENABLE_LOGIN=true
    user: "${PUID}:${PGID}"
    volumes:
      - ${APPS_DATA_DIR}/ntfy/cache:/var/cache/ntfy
      - ${APPS_DATA_DIR}/ntfy/storage:/var/lib/ntfy
    ports:
      - 3002:80
    healthcheck:
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    restart: unless-stopped
    init: true
    networks:
      - lefrigo-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notif.rule=Host(`notification.le-frigo.fr`)"
      - "traefik.http.routers.notif.entrypoints=websecure"
      - "traefik.http.routers.notif.tls=true"
      - "traefik.http.routers.notif.tls.certresolver=myresolver"
      - "traefik.http.services.notif.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 256M
        reservations:
          memory: 64M

  # --- FILEBROWSER ---
  filebrowser:
    image: filebrowser/filebrowser
    container_name: filebrowser
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - 8081:8080
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${MEDIA_DATA_DIR}:/srv/data
      - ${APPS_DATA_DIR}:/srv/apps
      - ${APPS_DATA_DIR}/filebrowser/database:/database
      - ${APPS_DATA_DIR}/filebrowser/config:/config
    networks:
      - lefrigo-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: [ 
      "--address", "0.0.0.0", 
      "--noauth",
      "--port", "8080", 
      "--database", "/database/filebrowser.db", 
      "--root", "/srv" 
    ]
    labels:
      - "traefik.enable=true"
      # --- Router 1 ---
      - "traefik.http.routers.filebrowser-public.rule=Host(`files.le-frigo.fr`) && (PathPrefix(`/share`) || PathPrefix(`/static`) || PathPrefix(`/api/public`))"
      - "traefik.http.routers.filebrowser-public.entrypoints=websecure"
      - "traefik.http.routers.filebrowser-public.tls.certresolver=myresolver"
      - "traefik.http.routers.filebrowser-public.priority=100"
      # --- Router 2 ---
      - "traefik.http.routers.filebrowser.rule=Host(`files.le-frigo.fr`)"
      - "traefik.http.routers.filebrowser.entrypoints=websecure"
      - "traefik.http.routers.filebrowser.tls.certresolver=myresolver"
      - "traefik.http.routers.filebrowser.priority=1"
      - "traefik.http.routers.filebrowser.middlewares=authentik@docker"
      # --- common ---
      - "traefik.http.services.filebrowser.loadbalancer.server.port=8080"

  # --- WALLOS ---
  wallos:
    image: bellamy/wallos:latest
    container_name: wallos
    restart: unless-stopped
    ports:
      - 8282:80/tcp
    environment:
      - TZ=Europe/Paris
    volumes:
      - ${APPS_DATA_DIR}/wallos/db:/var/www/html/db
      - ${APPS_DATA_DIR}/wallos/logos:/var/www/html/images/uploads/logos
    networks:
      - lefrigo-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wallos.rule=Host(`wallos.le-frigo.fr`)"
      - "traefik.http.routers.wallos.entrypoints=websecure"
      - "traefik.http.routers.wallos.tls.certresolver=myresolver"
      - "traefik.http.services.wallos.loadbalancer.server.port=80"

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    user: "${PUID}:${PGID}"
    container_name: jellyseerr
    ports:
      - 5055:5055
    volumes:
      - ${APPS_DATA_DIR}/jellyseer/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Paris
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.le-frigo.fr`)"
      - "traefik.http.routers.jellyseerr.entrypoints=websecure"
      - "traefik.http.routers.jellyseerr.tls.certresolver=myresolver"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"
    networks:
      - lefrigo-net
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
        reservations:
          memory: 512M

  # --- OUTLINE ---
  outline:
    image: docker.getoutline.com/outlinewiki/outline:latest
    container_name: outline
    restart: always
    user: ${PUID}:${PGID}
    networks:
      - lefrigo-net
    environment:
      NODE_ENV: production
      SECRET_KEY: ${OUTLINE_SECRET_KEY}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET}
      URL: https://doc.le-frigo.fr
      PORT: 3421
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-common:5432/outline
      REDIS_URL: redis://common-redis:6379/1
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_AUTH_URI: https://auth.le-frigo.fr/application/o/authorize/
      OIDC_TOKEN_URI: https://auth.le-frigo.fr/application/o/token/
      OIDC_USERINFO_URI: https://auth.le-frigo.fr/application/o/userinfo/
      OIDC_DISPLAY_NAME: LeFrigo
      FORCE_HTTPS: true
      ENABLE_SSL_VERIFICATION: true
      PGSSLMODE: disable
      HOST: 0.0.0.0
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FILE_STORAGE: local
      FILE_STORAGE_UPLOAD_MAX_SIZE: 26214400
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.outline.service=outline"
      - "traefik.http.routers.outline.rule=Host(`doc.le-frigo.fr`)"
      - "traefik.http.routers.outline.entrypoints=websecure"
      - "traefik.http.routers.outline.tls.certresolver=myresolver"
      - "traefik.http.services.outline.loadbalancer.server.port=3421"

networks:
  lefrigo-net:
    external: true