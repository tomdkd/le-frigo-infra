---
services:
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:v3.2.0
    init: true
    user: ${PUID}:${PGID}
    container_name: jellyseerr
    ports: [5055:5055]
    volumes: ['${APPS_DATA_DIR}/jellyseer/config:/app/config']
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status
        || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    environment: [LOG_LEVEL=debug, TZ=Europe/Paris]
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.le-frigo.fr`)
      - traefik.http.routers.jellyseerr.entrypoints=websecure
      - traefik.http.routers.jellyseerr.tls.certresolver=myresolver
      - traefik.http.services.jellyseerr.loadbalancer.server.port=5055
    networks: [lefrigo-net]
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
        reservations:
          memory: 512M

  # --- OUTLINE ---
  outline:
    image: docker.getoutline.com/outlinewiki/outline:1.7.1
    container_name: outline
    restart: always
    user: ${PUID}:${PGID}
    networks: [lefrigo-net]
    environment:
      NODE_ENV: production
      SECRET_KEY: ${OUTLINE_SECRET_KEY}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET}
      URL: https://doc.le-frigo.fr
      PORT: 3421
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-common:5432/outline
      REDIS_URL: redis://common-redis:6379/1
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_AUTH_URI: https://auth.le-frigo.fr/application/o/authorize/
      OIDC_TOKEN_URI: https://auth.le-frigo.fr/application/o/token/
      OIDC_USERINFO_URI: https://auth.le-frigo.fr/application/o/userinfo/
      OIDC_DISPLAY_NAME: LeFrigo
      FORCE_HTTPS: true
      ENABLE_SSL_VERIFICATION: true
      PGSSLMODE: disable
      HOST: 0.0.0.0
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FILE_STORAGE: local
      FILE_STORAGE_UPLOAD_MAX_SIZE: 26214400
    labels:
      - traefik.enable=true
      - traefik.http.routers.outline.service=outline
      - traefik.http.routers.outline.rule=Host(`doc.le-frigo.fr`)
      - traefik.http.routers.outline.entrypoints=websecure
      - traefik.http.routers.outline.tls.certresolver=myresolver
      - traefik.http.services.outline.loadbalancer.server.port=3421
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.5.4
    ports: [8123:8123]
    volumes:
      - ${APPS_DATA_DIR}/homeassistant/config:/config
      - ${APPS_DATA_DIR}/homeassistant/storage:/var/lib/homeassistant
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    networks: [lefrigo-net]
    environment:
      TZ: Europe/Paris
    labels:
      - traefik.enable=true
      - traefik.http.routers.homeassistant.service=homeassistant
      - traefik.http.routers.homeassistant.rule=Host(`house.le-frigo.fr`)
      - traefik.http.routers.homeassistant.entrypoints=websecure
      - traefik.http.routers.homeassistant.tls.certresolver=myresolver
      - traefik.http.services.homeassistant.loadbalancer.server.port=8123
      - traefik.http.routers.homeassistant.priority=1
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.16.0
    container_name: mealie
    restart: always
    ports: [9925:9000]
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes: ['${APPS_DATA_DIR}/mealie/data:/app/data/']
    networks: [lefrigo-net]
    environment:
      - ALLOW_SIGNUP=false
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Paris
      - BASE_URL=https://mealie.le-frigo.fr
      - DB_ENGINE=postgres
      - POSTGRES_USER=${POSTGRES_MEALIE_USER}
      - POSTGRES_PASSWORD=${POSTGRES_MEALIE_PASSWORD}
      - POSTGRES_SERVER=postgres-common
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mealie
      - OIDC_AUTH_ENABLED=true
      - OIDC_SIGNUP_ENABLED=true
      - OIDC_CONFIGURATION_URL=https://auth.le-frigo.fr/application/o/mealie/.well-known/openid-configuration
      - OIDC_CLIENT_ID=${MEALIE_OIDC_ID}
      - OIDC_CLIENT_SECRET=${MEALIE_OIDC_SECRET}
      - OIDC_AUTO_REDIRECT=true
    labels:
      - traefik.enable=true
      - traefik.http.routers.mealie.rule=Host(`mealie.le-frigo.fr`)
      - traefik.http.routers.mealie.entrypoints=websecure
      - traefik.http.routers.mealie.tls.certresolver=myresolver
      - traefik.http.services.mealie.loadbalancer.server.port=9000
      - traefik.http.routers.mealie.priority=1
  code-server:
    image: lscr.io/linuxserver/code-server:4.122.0
    container_name: code-server
    environment: ['PUID=${PUID}', 'PGID=${PGID}', TZ=Europe/Paris]
    volumes:
      - ${APPS_DATA_DIR}/code-server/config:/config
      - ${APPS_DATA_DIR}:/projects
    ports: [8443:8443]
    restart: unless-stopped
  whodb:
    image: clidey/whodb:0.113.0
    container_name: whodb
    ports: [2000:8080]
    environment: [TZ=Europe/Paris]
    restart: unless-stopped
    networks: [lefrigo-net, 01-sso_authentik-net]
  # --- FILEBROWSER ---
  filebrowser:
    image: filebrowser/filebrowser:v2.63.10-s6
    container_name: filebrowser
    ports: [6789:80]
    volumes: ['${MEDIA_DATA_DIR}:/srv']
    tmpfs: [/config, /database]
    environment:
      - TZ=Europe/Paris
      - PUID=${PUID}
      - PGID=${PGID}
      - FB_DATABASE=/database/filebrowser.db
      - FB_NOAUTH=true
    restart: unless-stopped
    networks: [lefrigo-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.filebrowser.rule=Host(`file.le-frigo.fr`)
      - traefik.http.routers.filebrowser.service=filebrowser
      - traefik.http.routers.filebrowser.entrypoints=websecure
      - traefik.http.routers.filebrowser.tls.certresolver=myresolver
      - traefik.http.services.filebrowser.loadbalancer.server.port=80
      - traefik.http.routers.filebrowser.middlewares=authentik@docker
  # --- PICARD ---
  picard:
    image: jlesage/musicbrainz-picard:v26.05.2
    container_name: picard
    ports: [5800:5800]
    environment: ['USER_ID=${PUID}', 'GROUP_ID=${PGID}']
    volumes: ['${MEDIA_DATA_DIR}/musique:/storage:rw']
    networks: [lefrigo-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.picard.rule=Host(`picard.le-frigo.fr`)
      - traefik.http.routers.picard.service=picard
      - traefik.http.routers.picard.entrypoints=websecure
      - traefik.http.routers.picard.tls.certresolver=myresolver
      - traefik.http.services.picard.loadbalancer.server.port=5800
      - traefik.http.routers.picard.middlewares=authentik@docker
    healthcheck:
      test: [CMD-SHELL, nc -z localhost 5800]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 512M
networks:
  lefrigo-net:
    external: true
  01-sso_authentik-net:
    external: true
